[package]
name = "mnz-chain-rust"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4.4.0"
serde = { version = "1.0.203", features = ["derive"] }
serde_json = "1.0.117"
rand = "0.8.5"
rand_core = "0.6.4"
tokio = { version = "1.38.0", features = ["full"] }
reqwest = { version = "0.11.27", features = ["json"] }
chrono = { version = "0.4.38", features = ["serde"] }
block-buffer = "=0.10.4"
digest = "=0.10.7"
